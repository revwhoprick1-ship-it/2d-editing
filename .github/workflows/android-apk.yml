name: Build CampaignProof APK

on:
  push:
    paths:
      - 'android/CampaignProof-Android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/CampaignProof-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore shared signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.CP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cp.jks"
            echo "CP_KEYSTORE_FILE=$RUNNER_TEMP/cp.jks" >> "$GITHUB_ENV"
            echo "Using shared signing key"
          else
            echo "::warning::CP_KEYSTORE_BASE64 secret not set - APK signed with a random debug key"
          fi
      - name: Build APK
        env:
          CP_KEYSTORE_PASSWORD: ${{ secrets.CP_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --stacktrace
      - name: Print signing SHA-1
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-1" || true
      - uses: actions/upload-artifact@v4
        with:
          name: CampaignProof-debug-apk
          path: android/CampaignProof-Android/app/build/outputs/apk/debug/*.apk
